<style>
/* Tizen 5.5 webview is an older Chromium: no container queries, aspect-ratio, inset or flex gap.
   Everything is sized in vw against a 1920x1080 screen. */
html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #17121f; color: #f3ece4; }
body { font-family: "Manrope", "Helvetica Neue", Arial, sans-serif; }
.disp { font-family: "Bricolage Grotesque", "Avenir Next", "Segoe UI", sans-serif; }
#bg { position: absolute; left: 0; top: 0; width: 100%; height: 100%; background: #17121f; }
#aura { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
#veil { position: absolute; left: 0; top: 0; width: 100%; height: 100%;
  background: linear-gradient(180deg, rgba(23,18,31,0) 45%, rgba(23,18,31,.55) 100%); }
#dust { position: absolute; left: 0; top: 0; width: 100%; height: 100%; opacity: .5; }
.screen { position: absolute; left: 5vw; right: 5vw; top: 4.2vw; bottom: 3.6vw; }

.time { font-weight: 300; font-size: 7.4vw; line-height: .9; letter-spacing: -0.03em; }
.date { margin-top: 1.1vw; font-weight: 500; font-size: 1.25vw; color: #a89cae; letter-spacing: .14em; text-transform: uppercase; }
.greet { margin-top: 2.2vw; font-size: 1.9vw; line-height: 1.3; max-width: 34vw; }
.greet em { font-style: normal; color: #f2b66b; }
.greet .ask { display: block; margin-top: .5vw; font-family: "Manrope", "Helvetica Neue", Arial, sans-serif; font-size: 1.25vw; color: #a89cae; }

.side { position: absolute; right: 0; top: 0; text-align: right; }
.weather { display: -webkit-flex; display: flex; -webkit-align-items: center; align-items: center; -webkit-justify-content: flex-end; justify-content: flex-end; }
.weather svg { width: 3.4vw; height: 3.4vw; margin-right: 1.2vw; }
.temp { font-weight: 300; font-size: 3.6vw; line-height: 1; margin-right: 1.2vw; }
.wx-meta { font-size: 1.05vw; color: #a89cae; line-height: 1.5; text-align: left; }

.bottom { position: absolute; left: 0; right: 0; bottom: 0; }
.rail-label { font-size: 1vw; letter-spacing: .16em; text-transform: uppercase; color: #a89cae; margin-bottom: 1.2vw; }
.rail { display: -webkit-flex; display: flex; }
.app {
  position: relative; box-sizing: border-box; -webkit-flex: 1; flex: 1; margin-right: 1.3vw;
  height: 11vw; border-radius: 1.1vw; padding: 1.3vw 1.4vw;
  background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.10);
  display: -webkit-flex; display: flex; -webkit-flex-direction: column; flex-direction: column;
  -webkit-justify-content: space-between; justify-content: space-between;
  transition: transform .22s cubic-bezier(.2,.8,.2,1), background-color .22s, border-color .22s, box-shadow .22s;
}
.app:last-child { margin-right: 0; }
.app.hero { -webkit-flex: 1.55; flex: 1.55; background-image: linear-gradient(140deg, rgba(242,182,107,.20), rgba(232,138,138,.10) 70%); }
.mark { width: 3.4vw; height: 3.4vw; border-radius: .8vw; box-sizing: border-box; padding: .65vw; text-align: center; line-height: 2.1vw; font-weight: 700; font-size: 1.35vw; color: #ffffff; box-shadow: 0 .3vw .8vw rgba(0,0,0,.35); }
.mark svg { display: block; width: 100%; height: 100%; }
.name { font-weight: 500; font-size: 1.45vw; }
.hero .name { font-size: 1.9vw; }
.sub { font-size: .95vw; color: #a89cae; margin-top: .3vw; }
.app.focus {
  transform: translateY(-.5vw) scale(1.04);
  background-color: rgba(255,255,255,.12); border-color: rgba(242,182,107,.85);
  box-shadow: 0 1.4vw 3vw -1vw rgba(0,0,0,.6), 0 0 0 .2vw rgba(242,182,107,.25);
}
.hint { position: absolute; right: 1.4vw; top: 1.2vw; font-size: .85vw; color: #f2b66b; opacity: 0; transition: opacity .2s; }
.app.focus .hint { opacity: 1; }
.toast { position: absolute; left: 50%; bottom: 1.2vw; transform: translateX(-50%); font-size: 1.05vw; background: rgba(0,0,0,.55); border: 1px solid rgba(255,255,255,.10); padding: .7vw 1.4vw; border-radius: 99px; opacity: 0; transition: opacity .25s; white-space: nowrap; }
.toast.on { opacity: 1; }
</style>

<script>
(function () {
  var days = ["Pazar","Pazartesi","Salı","Çarşamba","Perşembe","Cuma","Cumartesi"];
  var months = ["Ocak","Şubat","Mart","Nisan","Mayıs","Haziran","Temmuz","Ağustos","Eylül","Ekim","Kasım","Aralık"];
  function pad(n) { return (n < 10 ? "0" : "") + n; }
  function tick() {
    var n = new Date(), h = n.getHours();
    document.getElementById("time").textContent = pad(h) + ":" + pad(n.getMinutes());
    document.getElementById("date").textContent = days[n.getDay()] + " · " + n.getDate() + " " + months[n.getMonth()];
    var part = h < 6 ? "İyi geceler" : h < 12 ? "Günaydın" : h < 18 ? "İyi günler" : "İyi akşamlar";
    var ask = h < 6 ? "Gece filmi mi?" : h < 12 ? "Güne bir şeyle başlayalım mı?" : h < 18 ? "Bugün ne izliyoruz?" : "Bu akşam ne izliyoruz?";
    document.getElementById("greet").innerHTML = part + ", <em>Senay</em>.<span class=\"ask\">" + ask + "</span>";
  }
  tick(); setInterval(tick, 10000);

  // ---- weather (Open-Meteo, no key) ----
  var WX = { 0: "Açık", 1: "Az bulutlu", 2: "Parçalı bulutlu", 3: "Kapalı", 45: "Sisli", 48: "Kırağılı sis",
    51: "Hafif çisenti", 53: "Çisenti", 55: "Yoğun çisenti", 61: "Hafif yağmur", 63: "Yağmurlu", 65: "Sağanak",
    66: "Dondurucu yağmur", 67: "Dondurucu yağmur", 71: "Hafif kar", 73: "Karlı", 75: "Yoğun kar", 77: "Kar taneleri",
    80: "Sağanak", 81: "Sağanak", 82: "Şiddetli sağanak", 85: "Kar sağanağı", 86: "Kar sağanağı", 95: "Gök gürültülü", 96: "Dolu", 99: "Dolu" };
  function getJSON(url, cb) {
    var x = new XMLHttpRequest();
    x.open("GET", url);
    x.onload = function () { try { cb(JSON.parse(x.responseText)); } catch (e) {} };
    x.send();
  }
  var loc = null;
  function weather() {
    if (!loc) {
      getJSON("https://ipwho.is/", function (g) {
        if (!g || !g.success) return;
        loc = { lat: g.latitude, lon: g.longitude, city: g.city || "" };
        weather();
      });
      return;
    }
    getJSON("https://api.open-meteo.com/v1/forecast?latitude=" + loc.lat + "&longitude=" + loc.lon + "&current=temperature_2m,weather_code&timezone=auto", function (d) {
      var c = d.current;
      document.getElementById("temp").textContent = Math.round(c.temperature_2m) + "°";
      document.getElementById("wxcity").textContent = loc.city;
      document.getElementById("wxdesc").textContent = WX[c.weather_code] || "";
      document.getElementById("weather").style.visibility = "visible";
    });
  }
  weather(); setInterval(weather, 30 * 60 * 1000);

  // ---- toast ----
  var toastEl = document.getElementById("toast"), tt;
  function toast(msg, ms) {
    toastEl.textContent = msg; toastEl.className = "toast on";
    clearTimeout(tt); tt = setTimeout(function () { toastEl.className = "toast"; }, ms || 2200);
  }

  // ---- launching ----
  function launchTizenTube() {
    var done = false;
    var ws;
    try { ws = new WebSocket("ws://" + location.host); } catch (e) { toast("TizenBrew'a bağlanılamadı"); return; }
    var timer = setTimeout(function () { if (!done) { done = true; try { ws.close(); } catch (e) {} toast("TizenTube bulunamadı"); } }, 8000);
    ws.onopen = function () { ws.send(JSON.stringify({ type: 4, payload: false })); };
    ws.onmessage = function (ev) {
      var msg; try { msg = JSON.parse(ev.data); } catch (e) { return; }
      if (msg.type !== 4 || done) return;
      var list = msg.payload || [], mod = null;
      for (var i = 0; i < list.length; i++) if (/tizentube/i.test(list[i].fullName || "")) mod = list[i];
      if (!mod) { // cache empty: ask the service to load modules fresh
        if (!ws._retried) { ws._retried = true; ws.send(JSON.stringify({ type: 4, payload: true })); return; }
        done = true; clearTimeout(timer); toast("TizenTube bulunamadı"); return;
      }
      done = true; clearTimeout(timer);
      try { for (var k = 0; k < (mod.keys || []).length; k++) tizen.tvinputdevice.registerKey(mod.keys[k]); } catch (e) {}
      ws.send(JSON.stringify({ type: 5, payload: mod }));
      if (!mod.evaluateScriptOnDocumentStart) setTimeout(function () { location.href = mod.appPath; }, 150);
    };
    ws.onerror = function () { if (!done) { done = true; clearTimeout(timer); toast("TizenBrew'a bağlanılamadı"); } };
  }
  // Apps are opened by this module's background service (service.js, port 8090), which runs
  // with TizenBrew's launch permission. Fallback: the TV's local launcher on port 8001.
  var SVC = "http://127.0.0.1:8090";
  function get(u, cb) {
    var x = new XMLHttpRequest();
    x.open("GET", u); x.timeout = 9000;
    x.onload = function () { var d = null; try { d = JSON.parse(x.responseText); } catch (e) {} cb(d); };
    x.onerror = x.ontimeout = function () { cb(null); };
    x.send();
  }
  function restFallback(id) {
    var x = new XMLHttpRequest();
    x.open("POST", "http://127.0.0.1:8001/api/v2/applications/" + id);
    x.send("");
  }
  function launchApp(id, label) {
    get(SVC + "/launch?id=" + encodeURIComponent(id), function (d) {
      if (!d) { restFallback(id); toast(label + ": servis yok, yedek yol denendi", 4000); }
      else if (!d.ok) toast(label + " açılamadı (" + d.error + ")", 6000);
    });
  }
  var appsCache = null;
  function launchByName(pattern, label) {
    var re = new RegExp(pattern, "i");
    function pick(list) {
      for (var n = 0; n < list.length; n++) if (re.test(list[n].name || "")) return launchApp(list[n].id, label);
      toast(label + " bulunamadı", 4000);
    }
    if (appsCache) return pick(appsCache);
    get(SVC + "/apps", function (d) {
      if (!d || !d.ok) { toast(label + " bulunamadı (" + (d ? d.error : "servis yok") + ")", 6000); return; }
      appsCache = d.apps; pick(appsCache);
    });
  }
  function open(el) {
    toast(el.getAttribute("data-label") + " açılıyor…", 1500);
    if (el.getAttribute("data-kind") === "tizentube") launchTizenTube();
    else if (el.getAttribute("data-match")) launchByName(el.getAttribute("data-match"), el.getAttribute("data-label"));
    else launchApp(el.getAttribute("data-id"), el.getAttribute("data-label"));
  }

  // ---- remote navigation ----
  var apps = document.querySelectorAll(".app"), i = 0;
  function focusAt(k) { apps[i].classList.remove("focus"); i = (k + apps.length) % apps.length; apps[i].classList.add("focus"); }
  document.addEventListener("keydown", function (e) {
    if (e.keyCode === 39) { focusAt(i + 1); e.preventDefault(); }
    else if (e.keyCode === 37) { focusAt(i - 1); e.preventDefault(); }
    else if (e.keyCode === 13) { open(apps[i]); e.preventDefault(); }
    else if (e.keyCode === 10009) { try { tizen.application.getCurrentApplication().exit(); } catch (x) {} }
  });
  for (var a = 0; a < apps.length; a++) (function (k) {
    apps[k].addEventListener("click", function () { focusAt(k); open(apps[k]); });
  })(a);


  // ---- aura: three soft lights drifting slowly, drawn tiny and stretched for a free blur ----
  var ac = document.getElementById("aura"), ax = ac.getContext("2d"), AW = ac.width, AH = ac.height;
  var lights = [
    { c: "242,182,107", a: .30, r: .62, px: .72, py: .05, ax: .16, ay: .14, sx: 1 / 47, sy: 1 / 61, ph: 0 },
    { c: "232,138,138", a: .20, r: .55, px: .15, py: .95, ax: .14, ay: .12, sx: 1 / 53, sy: 1 / 41, ph: 2 },
    { c: "150,110,220", a: .18, r: .50, px: .45, py: .55, ax: .26, ay: .18, sx: 1 / 67, sy: 1 / 59, ph: 4 }
  ];
  var t0 = Date.now();
  function drawAura() {
    var t = (Date.now() - t0) / 1000;
    ax.globalCompositeOperation = "source-over";
    ax.fillStyle = "#17121f"; ax.fillRect(0, 0, AW, AH);
    ax.globalCompositeOperation = "lighter";
    for (var k = 0; k < lights.length; k++) {
      var L = lights[k];
      var cx = (L.px + L.ax * Math.sin(t * 2 * Math.PI * L.sx + L.ph)) * AW;
      var cy = (L.py + L.ay * Math.cos(t * 2 * Math.PI * L.sy + L.ph)) * AH;
      var rr = L.r * AW * (1 + .08 * Math.sin(t * .2 + L.ph));
      var breathe = L.a * (.85 + .15 * Math.sin(t * .15 + L.ph * 1.7));
      var g = ax.createRadialGradient(cx, cy, 0, cx, cy, rr);
      g.addColorStop(0, "rgba(" + L.c + "," + breathe + ")");
      g.addColorStop(1, "rgba(" + L.c + ",0)");
      ax.fillStyle = g; ax.fillRect(0, 0, AW, AH);
    }
    setTimeout(drawAura, 66);
  }
  drawAura();

  // ---- drifting dust in the spotlight ----
  var c = document.getElementById("dust"), x = c.getContext("2d"), W, H, ps = [];
  function size() {
    W = c.width = window.innerWidth; H = c.height = window.innerHeight; ps = [];
    for (var n = 0; n < 45; n++) ps.push({ x: W * (.45 + Math.random() * .5), y: Math.random() * H * .8, r: Math.random() * 1.4 + .3, v: Math.random() * .25 + .05, a: Math.random() });
  }
  function draw() {
    x.clearRect(0, 0, W, H);
    for (var n = 0; n < ps.length; n++) {
      var p = ps[n];
      p.y -= p.v; p.x += Math.sin((p.y + p.a * 500) / 120) * .15;
      if (p.y < 0) p.y = H * .8;
      x.fillStyle = "rgba(242,182,107," + (0.25 + 0.35 * p.a) + ")";
      x.beginPath(); x.arc(p.x, p.y, p.r, 0, 7); x.fill();
    }
    requestAnimationFrame(draw);
  }
  size(); draw(); window.addEventListener("resize", size);
})();
</script>
