<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Salon TV</title>
<style>html,body{margin:0;background:#0b0b0e}</style>
</head>
<body>
<script>
// Loader: asks GitHub for the newest commit and loads that exact version from jsDelivr.
// Commit-pinned URLs never go stale, so updates reach the TV at once.
// Falls back to the copy TizenBrew already serves next to this file.
(function () {
  var REPO = "Zalylex/salon-tv", done = false;
  function show(html, base) {
    if (done) return; done = true;
    if (base) html = html.replace("<head>", '<head><base href="' + base + '">');
    document.open(); document.write(html); document.close();
  }
  function get(url, headers, cb) {
    var x = new XMLHttpRequest();
    x.open("GET", url); x.timeout = 5000;
    for (var h in headers) x.setRequestHeader(h, headers[h]);
    x.onload = function () { cb(x.status === 200 ? x.responseText : null); };
    x.onerror = x.ontimeout = function () { cb(null); };
    x.send();
  }
  function fallback() { get("main.html", {}, function (t) { if (t) show(t, ""); }); }
  setTimeout(fallback, 7000);
  get("https://api.github.com/repos/" + REPO + "/commits/main", { "Accept": "application/vnd.github.sha" }, function (sha) {
    sha = (sha || "").trim();
    if (!/^[0-9a-f]{40}$/.test(sha)) return fallback();
    var base = "https://cdn.jsdelivr.net/gh/" + REPO + "@" + sha + "/app/";
    get(base + "main.html", {}, function (t) { if (t) show(t, base); else fallback(); });
  });
})();
</script>
</body>
</html>
