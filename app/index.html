<style>
/* tvOS-style home for a Tizen 5.5 webview (old Chromium): sized in vw on a 1920x1080 screen,
   no container queries, aspect-ratio, inset, flex gap or backdrop-filter. */
html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #0b0b0e; color: #f5f5f7; }
body { font-family: "Inter", "Helvetica Neue", Arial, sans-serif; -webkit-font-smoothing: antialiased; }
.fill { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }

.hero { position: absolute; right: 0; top: 0; width: 74%; height: 82%;
  -webkit-mask-image: linear-gradient(90deg, rgba(0,0,0,0) 0%, #000 38%), linear-gradient(180deg, #000 62%, rgba(0,0,0,0) 100%);
  -webkit-mask-composite: source-in; }
.hero img { position: absolute; left: 0; top: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0;
  transition: opacity 260ms cubic-bezier(0.23, 1, 0.32, 1); }
.hero img.on { opacity: 1; }
.vignette { background:
  linear-gradient(90deg, rgba(11,11,14,.55) 0%, rgba(11,11,14,0) 45%),
  linear-gradient(180deg, rgba(0,0,0,0) 60%, rgba(0,0,0,.55) 100%); }

.greet { position: absolute; left: 6vw; top: 3.8vw; }
.greet .hi { font-size: 1.85vw; font-weight: 600; letter-spacing: -.025em; line-height: 1.1; }
.greet .ask { margin-top: .4vw; font-size: 1.2vw; font-weight: 500; color: rgba(245,245,247,.62); }

.chrome { position: absolute; right: 6vw; top: 3.8vw; display: -webkit-flex; display: flex; -webkit-align-items: baseline; align-items: baseline; }
.chrome .wx { font-size: 1.3vw; font-weight: 500; color: rgba(245,245,247,.62); margin-right: 1.4vw; visibility: hidden; }
.chrome .clock { font-size: 1.85vw; font-weight: 600; letter-spacing: -.01em; }

.shelf { position: absolute; left: 6vw; top: 15.5vw; max-width: 30vw; }
.shelf div { transition: opacity 220ms cubic-bezier(0.23, 1, 0.32, 1), transform 220ms cubic-bezier(0.23, 1, 0.32, 1); }
.shelf.swap div { opacity: 0; transform: translateY(.4vw); }
.app-name { font-size: 4vw; font-weight: 700; letter-spacing: -.035em; line-height: 1; }
.app-desc { margin-top: 1vw; font-size: 1.55vw; font-weight: 500; color: rgba(245,245,247,.62); }

.row { position: absolute; left: 6vw; bottom: 4.6vw; height: 7.8vw; }
.tile { position: absolute; top: 0; width: 13vw; height: 7.8vw; border-radius: 1vw;
  display: -webkit-flex; display: flex; -webkit-align-items: center; align-items: center; -webkit-justify-content: center; justify-content: center;
  box-shadow: 0 .6vw 1.4vw -.6vw rgba(0,0,0,.6);
  transition: transform 200ms cubic-bezier(0.23, 1, 0.32, 1), box-shadow 200ms cubic-bezier(0.23, 1, 0.32, 1); }
.tile .sheen, .tile .glare { position: absolute; left: 0; top: 0; width: 100%; height: 100%; border-radius: 1vw; }
.tile .sheen { background: linear-gradient(180deg, rgba(255,255,255,.09), rgba(255,255,255,.02) 55%, rgba(255,255,255,0)); box-shadow: inset 0 0 0 1px rgba(255,255,255,.07); }
.tile .glare { background: radial-gradient(60% 80% at 30% 0%, rgba(255,255,255,.28), rgba(255,255,255,0) 60%); opacity: 0; transition: opacity 200ms cubic-bezier(0.23, 1, 0.32, 1); }
.tile svg { position: relative; height: 3vw; width: 3vw; display: block; }
.tile.wide svg { height: 4.6vw; width: 4.6vw; }
.tile .label { position: absolute; left: 0; right: 0; top: 100%; margin-top: 1.1vw; text-align: center; font-size: 1.05vw; font-weight: 600;
  opacity: 0; transform: translateY(-.3vw); transition: opacity 180ms cubic-bezier(0.23, 1, 0.32, 1), transform 180ms cubic-bezier(0.23, 1, 0.32, 1); }
.tile.focus { transform: translateY(-.6vw) scale(1.1); box-shadow: 0 2.4vw 3.6vw -1.2vw rgba(0,0,0,.75); z-index: 2; }
.tile.focus .glare { opacity: 1; }
.tile.focus .label { opacity: 1; transform: none; }
.tile.focus.pressed { transform: translateY(-.4vw) scale(1.06); transition-duration: 100ms; }
.ontv { position: relative; font-size: 1.9vw; font-weight: 700; letter-spacing: -.03em; color: #fff; }
.ontv span { font-weight: 500; opacity: .7; }

.toast { position: absolute; left: 50%; top: 3.8vw; font-size: 1vw; font-weight: 500; padding: .6vw 1.2vw; border-radius: 99px;
  background: rgba(40,40,46,.85); border: 1px solid rgba(255,255,255,.1); white-space: nowrap;
  opacity: 0; -webkit-transform: translate(-50%, -.4vw); transform: translate(-50%, -.4vw);
  transition: opacity 200ms cubic-bezier(0.23, 1, 0.32, 1), transform 200ms cubic-bezier(0.23, 1, 0.32, 1); }
.toast.on { opacity: 1; -webkit-transform: translate(-50%, 0); transform: translate(-50%, 0); }
</style>

<script>
(function () {
  function pad(n) { return (n < 10 ? "0" : "") + n; }
  function tick() {
    var n = new Date(), h = n.getHours();
    document.getElementById("clock").textContent = pad(h) + ":" + pad(n.getMinutes());
    var part = h < 6 ? "İyi geceler" : h < 12 ? "Günaydın" : h < 18 ? "İyi günler" : "İyi akşamlar";
    document.getElementById("greet").textContent = part + ", Senay";
    document.getElementById("ask").textContent = h < 6 ? "Gece filmi mi?" : h < 12 ? "Güne bir şeyle başlayalım mı?" : h < 18 ? "Bugün ne izliyoruz?" : "Bu akşam ne izliyoruz?";
  }
  tick(); setInterval(tick, 10000);

  // ---- weather (Open-Meteo, no key) ----
  var WX = { 0: "Açık", 1: "Az bulutlu", 2: "Parçalı bulutlu", 3: "Kapalı", 45: "Sisli", 48: "Kırağılı sis",
    51: "Hafif çisenti", 53: "Çisenti", 55: "Yoğun çisenti", 61: "Hafif yağmur", 63: "Yağmurlu", 65: "Sağanak",
    66: "Dondurucu yağmur", 67: "Dondurucu yağmur", 71: "Hafif kar", 73: "Karlı", 75: "Yoğun kar", 77: "Kar taneleri",
    80: "Sağanak", 81: "Sağanak", 82: "Şiddetli sağanak", 85: "Kar sağanağı", 86: "Kar sağanağı", 95: "Gök gürültülü", 96: "Dolu", 99: "Dolu" };
  function getJSON(url, cb) {
    var x = new XMLHttpRequest();
    x.open("GET", url);
    x.onload = function () { try { cb(JSON.parse(x.responseText)); } catch (e) {} };
    x.send();
  }
  var loc = null;
  function weather() {
    if (!loc) {
      getJSON("https://ipwho.is/", function (g) {
        if (!g || !g.success) return;
        loc = { lat: g.latitude, lon: g.longitude, city: g.city || "" };
        weather();
      });
      return;
    }
    getJSON("https://api.open-meteo.com/v1/forecast?latitude=" + loc.lat + "&longitude=" + loc.lon + "&current=temperature_2m,weather_code&timezone=auto", function (d) {
      var c = d.current;
      document.getElementById("temp").textContent = Math.round(c.temperature_2m) + "°";
      document.getElementById("wxcity").textContent = loc.city;
      document.getElementById("wxdesc").textContent = WX[c.weather_code] || "";
      document.getElementById("weather").style.visibility = "visible";
    });
  }
  weather(); setInterval(weather, 30 * 60 * 1000);
  // ---- toast ----
  var toastEl = document.getElementById("toast"), tt;
  function toast(msg, ms) {
    toastEl.textContent = msg; toastEl.className = "toast on";
    clearTimeout(tt); tt = setTimeout(function () { toastEl.className = "toast"; }, ms || 2200);
  }

  // ---- launching ----
  function launchTizenTube() {
    var done = false;
    var ws;
    try { ws = new WebSocket("ws://" + location.host); } catch (e) { toast("TizenBrew'a bağlanılamadı"); return; }
    var timer = setTimeout(function () { if (!done) { done = true; try { ws.close(); } catch (e) {} toast("TizenTube bulunamadı"); } }, 8000);
    ws.onopen = function () { ws.send(JSON.stringify({ type: 4, payload: false })); };
    ws.onmessage = function (ev) {
      var msg; try { msg = JSON.parse(ev.data); } catch (e) { return; }
      if (msg.type !== 4 || done) return;
      var list = msg.payload || [], mod = null;
      for (var i = 0; i < list.length; i++) if (/tizentube/i.test(list[i].fullName || "")) mod = list[i];
      if (!mod) { // cache empty: ask the service to load modules fresh
        if (!ws._retried) { ws._retried = true; ws.send(JSON.stringify({ type: 4, payload: true })); return; }
        done = true; clearTimeout(timer); toast("TizenTube bulunamadı"); return;
      }
      done = true; clearTimeout(timer);
      try { for (var k = 0; k < (mod.keys || []).length; k++) tizen.tvinputdevice.registerKey(mod.keys[k]); } catch (e) {}
      ws.send(JSON.stringify({ type: 5, payload: mod }));
      if (!mod.evaluateScriptOnDocumentStart) setTimeout(function () { location.href = mod.appPath; }, 150);
    };
    ws.onerror = function () { if (!done) { done = true; clearTimeout(timer); toast("TizenBrew'a bağlanılamadı"); } };
  }
  // Apps are opened by this module's background service (service.js, port 8090), which runs
  // with TizenBrew's launch permission. Fallback: the TV's local launcher on port 8001.
  var SVC = "http://127.0.0.1:8090";
  function get(u, cb) {
    var x = new XMLHttpRequest();
    x.open("GET", u); x.timeout = 9000;
    x.onload = function () { var d = null; try { d = JSON.parse(x.responseText); } catch (e) {} cb(d); };
    x.onerror = x.ontimeout = function () { cb(null); };
    x.send();
  }
  function restFallback(id) {
    var x = new XMLHttpRequest();
    x.open("POST", "http://127.0.0.1:8001/api/v2/applications/" + id);
    x.send("");
  }
  function launchApp(id, label) {
    get(SVC + "/launch?id=" + encodeURIComponent(id), function (d) {
      if (!d) { restFallback(id); toast(label + ": servis yok, yedek yol denendi", 4000); }
      else if (!d.ok) toast(label + " açılamadı (" + d.error + ")", 6000);
    });
  }
  var appsCache = null;
  function launchByName(pattern, label) {
    var re = new RegExp(pattern, "i");
    function pick(list) {
      for (var n = 0; n < list.length; n++) if (re.test(list[n].name || "")) return launchApp(list[n].id, label);
      toast(label + " bulunamadı", 4000);
    }
    if (appsCache) return pick(appsCache);
    get(SVC + "/apps", function (d) {
      if (!d || !d.ok) { toast(label + " bulunamadı (" + (d ? d.error : "servis yok") + ")", 6000); return; }
      appsCache = d.apps; pick(appsCache);
    });
  }
  function open(el) {
    toast(el.getAttribute("data-label") + " açılıyor", 1500);
    if (el.getAttribute("data-kind") === "tizentube") launchTizenTube();
    else if (el.getAttribute("data-match")) launchByName(el.getAttribute("data-match"), el.getAttribute("data-label"));
    else launchApp(el.getAttribute("data-id"), el.getAttribute("data-label"));
  }

  // ---- tiles: lay out the row (no flex gap in this browser) ----
  var tiles = document.querySelectorAll(".tile"), i = 0;
  for (var t = 0; t < tiles.length; t++) tiles[t].style.left = (t * 14.7) + "vw";

  // ---- ambient light: takes the focused app's colour, always easing from where it is ----
  var c = document.getElementById("aura"), x = c.getContext("2d"), W = c.width, H = c.height;
  var cur = [255, 48, 48], target = [255, 48, 48];
  function blob(cx, cy, r, col, a) {
    var g = x.createRadialGradient(cx, cy, 0, cx, cy, r);
    var rgb = Math.round(col[0]) + "," + Math.round(col[1]) + "," + Math.round(col[2]);
    g.addColorStop(0, "rgba(" + rgb + "," + a + ")"); g.addColorStop(1, "rgba(" + rgb + ",0)");
    x.fillStyle = g; x.fillRect(0, 0, W, H);
  }
  var settled = false;
  function frame() {
    var moving = false;
    for (var k = 0; k < 3; k++) { var d = target[k] - cur[k]; if (Math.abs(d) > .5) moving = true; cur[k] += d * .12; }
    if (moving || !settled) {
      x.globalCompositeOperation = "source-over"; x.fillStyle = "#0b0b0e"; x.fillRect(0, 0, W, H);
      x.globalCompositeOperation = "lighter";
      blob(W * .70, H * .12, W * .75, cur, .34);
      blob(W * .12, H * .95, W * .55, cur, .14);
      blob(W * .40, H * .45, W * .6, [120, 120, 140], .05);
      settled = !moving;
    }
    setTimeout(frame, 33);
  }
  frame();

  // ---- hero artwork: two layers, crossfade once focus rests for 100ms ----
  var heroA = document.getElementById("heroA"), heroB = document.getElementById("heroB"), front = heroA, artT;
  function showArt() {
    var src = "art/" + tiles[i].getAttribute("data-art") + ".jpg";
    if (front.getAttribute("src") === src && front.className === "on") return;
    var back = front === heroA ? heroB : heroA;
    back.onload = function () { back.className = "on"; front.className = ""; front = back; };
    back.src = src;
  }
  showArt();
  // warm the cache so later crossfades are instant
  setTimeout(function () { for (var p = 0; p < tiles.length; p++) { var im = new Image(); im.src = "art/" + tiles[p].getAttribute("data-art") + ".jpg"; } }, 1500);

  var shelf = document.getElementById("shelf"), nameEl = document.getElementById("appName"), descEl = document.getElementById("appDesc"), swapT;
  function focusAt(k) {
    k = Math.max(0, Math.min(tiles.length - 1, k));   // stops at the ends, like tvOS
    if (k === i) return;
    tiles[i].classList.remove("focus"); tiles[i].classList.remove("pressed");
    i = k; tiles[i].classList.add("focus");
    target = tiles[i].getAttribute("data-tint").split(",").map(Number); settled = false;
    shelf.className = "shelf swap"; clearTimeout(swapT);
    swapT = setTimeout(function () {
      nameEl.textContent = tiles[i].getAttribute("data-label"); descEl.textContent = tiles[i].getAttribute("data-desc");
      shelf.className = "shelf";
    }, 120);
    clearTimeout(artT); artT = setTimeout(showArt, 100);
  }

  // ---- remote ----
  document.addEventListener("keydown", function (e) {
    if (e.keyCode === 39) { focusAt(i + 1); e.preventDefault(); }
    else if (e.keyCode === 37) { focusAt(i - 1); e.preventDefault(); }
    else if (e.keyCode === 13) {
      var el = tiles[i]; el.classList.add("pressed");
      setTimeout(function () { el.classList.remove("pressed"); }, 140);
      open(el); e.preventDefault();
    }
    else if (e.keyCode === 10009) { try { tizen.application.getCurrentApplication().exit(); } catch (z) {} }
  });
})();
</script>
</body>
</html>
